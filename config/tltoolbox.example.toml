#   app_log_dir                   = 缺省 → exe 同级 logs
#   popup_screenshot_dir          = 缺省 → exe 同级 logs/popup_screenshots
#   terminal_log_retention_days   = 缺省 → 14 天
# [topmost_manager] enabled=false, pinned_rules=[]
# [port_hunter]     confirm_before_kill=true, show_system_ports=false, log_dir=缺省 → logs/port_hunter
# [icon_locker]     enabled=false, auto_restore=true, profiles=[]
# ==============================================================================
